<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="retail-sales-split — is the latest slowdown broad-based or one or two categories, and does the 2025 rebasing change the headline: a six-repo series on Singapore's public data">
  <rect width="1280" height="320" fill="#FBFBF9"/>
  <title>retail-sales-split — a six-repo series on Singapore's public data</title>
  <text x="72" y="118" font-family="Georgia, 'Source Serif 4', serif" font-size="58" fill="#14293D">retail-sales-split</text>
  <rect x="72" y="146" width="430" height="4" fill="#8A6EAF"/>
  <text x="72" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5C6B79">Is the July 2026 slowdown broad-based — or one or</text>
  <text x="72" y="222" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5C6B79">two categories? And does the 2025 rebasing change</text>
  <text x="72" y="248" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5C6B79">the headline? The split: <tspan fill="#8A6EAF">●</tspan> volume −1.3% vs <tspan fill="#22607B">●</tspan> values +1.5%,</text>
  <text x="72" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5C6B79">11 industries — retail only; F&amp;B services kept separate.</text>
  <text x="72" y="306" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8B98A5">Retail Sales Index (2025=100) · SingStat Table Builder · latest month</text>
  <line x1="850" y1="170" x2="1150" y2="170" stroke="#E7E3DC" stroke-width="3"/>
  <line x1="1000" y1="150" x2="1000" y2="190" stroke="#C9C6BF" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="896" cy="170" r="10" fill="#8A6EAF"/>
  <circle cx="1120" cy="170" r="10" fill="#22607B"/>
  <text x="896" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8A6EAF">volume −1.3%</text>
  <text x="1120" y="140" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#22607B">values +1.5%</text>
  <text x="1000" y="246" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8B98A5">July 2026, year-on-year</text>
  <text x="1208" y="306" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8A6EAF">A six-repo series on Singapore's public data · 4 of 6</text>
