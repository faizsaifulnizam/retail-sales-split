name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile sources
        run: python -m compileall -q src

      - name: Offline stdlib pipeline regressions (raw integration skips when absent)
        run: python tests/test_pipeline_regressions.py -v

      - name: Check committed outputs, figures and assets
        run: python tests/smoke_test.py
